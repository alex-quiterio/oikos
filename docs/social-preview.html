<!doctype html>
<meta charset="utf-8" />
<style>
  html,
  body {
    margin: 0;
    width: 1280px;
    height: 640px;
    background: #0d1411;
    color: #e3ebe6;
    font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
  }
  .wrap {
    display: flex;
    align-items: center;
    gap: 56px;
    height: 100%;
    padding: 0 96px;
    box-sizing: border-box;
  }
  .logo {
    width: 230px;
    height: 230px;
    flex: none;
  }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 132px;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 36px;
    line-height: 1.3;
    margin: 18px 0 0;
    color: #97a89e;
    max-width: 640px;
  }
  .pills {
    display: flex;
    gap: 14px;
    margin-top: 34px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pills span {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #97a89e;
  }
  .pills i {
    width: 30px;
    height: 6px;
    border-radius: 3px;
    display: block;
  }
</style>
<div class="wrap">
  <div class="logo">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 128 128"
      role="img"
      aria-label="Oikos logo"
    >
      <title>Oikos</title>
      <rect width="128" height="128" rx="28" fill="#14231C" />
      <path
        d="M71.90 26.83 A38 38 0 0 1 100.53 53.53"
        fill="none"
        stroke="#F2A93B"
        stroke-width="9"
        stroke-linecap="round"
      />
      <path
        d="M108.22 51.32 L103.84 65.06 L92.84 55.73 Z"
        fill="#F2A93B"
      />
      <path
        d="M101.17 71.90 A38 38 0 0 1 74.47 100.53"
        fill="none"
        stroke="#3CC2CC"
        stroke-width="9"
        stroke-linecap="round"
      />
      <path
        d="M76.68 108.22 L62.94 103.84 L72.27 92.84 Z"
        fill="#3CC2CC"
      />
      <path
        d="M56.10 101.17 A38 38 0 0 1 27.47 74.47"
        fill="none"
        stroke="#F0709A"
        stroke-width="9"
        stroke-linecap="round"
      />
      <path
        d="M19.78 76.68 L24.16 62.94 L35.16 72.27 Z"
        fill="#F0709A"
      />
      <path
        d="M26.83 56.10 A38 38 0 0 1 53.53 27.47"
        fill="none"
        stroke="#A890F2"
        stroke-width="9"
        stroke-linecap="round"
      />
      <path
        d="M51.32 19.78 L65.06 24.16 L55.73 35.16 Z"
        fill="#A890F2"
      />
      <circle cx="64" cy="64" r="11" fill="#CBE0BC" />
      <path
        d="M64 64 C64 54 70 49 78 48 C78 57 72 63 64 64 Z"
        fill="#6FCB9F"
      />
      <path
        d="M64 64 C64 71 59 76 52 77 C52 70 57 65 64 64 Z"
        fill="#6FCB9F"
        opacity=".75"
      />
    </svg>
  </div>
  <div>
    <h1>Oikos</h1>
    <p>
      The household accounts of living places. Explore how energy,
      nutrients and seeds move through eleven ecosystems.
    </p>
    <div class="pills">
      <span><i style="background: #f2a93b"></i>energy</span>
      <span><i style="background: #3cc2cc"></i>nitrogen</span>
      <span><i style="background: #f0709a"></i>phosphorus</span>
      <span><i style="background: #a890f2"></i>seeds</span>
    </div>
  </div>
</div>
